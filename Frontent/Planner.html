
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Planner | StudyMate AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="planner">
  <div class="app-layout">
    <aside class="sidebar">
      <a class="brand" href="dashboard.html"><span>✦</span> StudyMate AI</a>
      <p class="nav-heading">MENU</p>
      <a class="nav-link" href="dashboard.html">▦ Dashboard</a>
      <a class="nav-link active" href="planner.html">▤ Study Planner</a>
      <a class="nav-link" href="dashboard.html#subjects">◈ Subjects</a>
      <a class="nav-link" href="dashboard.html#focus">◷ Focus Timer</a>
      <div class="sidebar-bottom">
        <button id="themeToggle" class="nav-link">☼ Toggle theme</button>
        <button id="logoutBtn" class="nav-link">↪ Log out</button>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div>
          <h1>Study Planner</h1>
          <p class="muted">Organize your learning, one task at a time.</p>
        </div>
        <div class="user-chip">👤 <span id="userName">Student</span></div>
      </header>

      <section class="panel planner-panel">
        <div class="panel-heading">
          <div>
            <h2>Create a study task</h2>
            <p class="muted small">Add a task to your personal study schedule.</p>
          </div>
        </div>
        <form id="taskForm" class="task-form">
          <div>
            <label for="taskTitle">Task title</label>
            <input id="taskTitle" placeholder="e.g. Revise data structures" required maxlength="100">
          </div>
          <div>
            <label for="taskSubject">Subject</label>
            <select id="taskSubject">
              <option value="">General study</option>
            </select>
          </div>
          <div>
            <label for="taskDate">Due date</label>
            <input type="date" id="taskDate" required>
          </div>
          <div>
            <label for="taskPriority">Priority</label>
            <select id="taskPriority">
              <option value="Normal">Normal</option>
              <option value="High">High</option>
              <option value="Low">Low</option>
            </select>
          </div>
          <button class="btn primary" type="submit">+ Add task</button>
        </form>
      </section>

      <section class="panel">
        <div class="panel-heading">
          <div>
            <h2>My study tasks</h2>
            <p class="muted small">Manage your tasks and monitor progress.</p>
          </div>
          <select id="taskFilter" class="filter-select" aria-label="Filter tasks">
            <option value="all">All tasks</option>
            <option value="pending">Pending</option>
            <option value="completed">Completed</option>
          </select>
        </div>
        <div id="plannerTasks" class="task-list"></div>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
